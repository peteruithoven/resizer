name: CI

# Runs on pushes to main and on PR lifecycle events, but not both for the same
# commit: a push to a branch with an open PR would otherwise fire `push` *and*
# `pull_request:synchronize` for the identical SHA, running every job twice.
# (test commit: confirming synchronize alone still fires CI)
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  vala-lint:
    name: Vala Lint
    runs-on: ubuntu-latest
    container: valalang/lint:latest
    steps:
    - uses: actions/checkout@v5
    - name: Lint
      run: io.elementary.vala-lint -d src

  meson-format:
    name: Meson Format
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install meson
      run: pip install --user --break-system-packages "meson>=1.5"
    - name: Check formatting
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        meson format --check-only -r .

  po-lint:
    name: PO Files
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install gettext
      run: sudo apt-get update && sudo apt-get install -y gettext
    - name: Check .po files
      run: |
        for po in po/*.po; do
          msgfmt --check --check-format --check-domain -o /dev/null "$po"
        done

  translations:
    name: Translations
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y meson ninja-build valac libgtk-4-dev \
          libadwaita-1-dev gettext desktop-file-utils
    - name: Regenerate translation templates
      run: |
        meson setup build
        ninja -C build io.github.peteruithoven.resizer-pot extra-pot
    - name: Check translation templates are up to date
      id: pot-diff
      run: |
        # Source line references shift on every unrelated code edit, and
        # POT-Creation-Date changes on every regeneration - neither means a
        # translator needs to do anything, so they don't count as "changed".
        ignore='^[+-](#:|#,|"POT-Creation-Date)'
        significant=$(git diff --unified=0 -- po/io.github.peteruithoven.resizer.pot po/extra/extra.pot \
          | grep -E '^[+-]' | grep -Ev '^(\+\+\+|---)' | grep -Ev "$ignore" || true)
        if [ -z "$significant" ]; then
          echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          echo "Translation templates are up to date."
        else
          echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          echo "Translatable strings changed but the templates weren't regenerated:"
          echo "$significant"
        fi
    - name: Commit updated templates
      if: steps.pot-diff.outputs.up_to_date == 'false' && github.event_name == 'push'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add po/io.github.peteruithoven.resizer.pot po/extra/extra.pot
        git commit -m "Update translation templates"
        git push
    - name: Fail if templates are stale
      if: steps.pot-diff.outputs.up_to_date == 'false' && github.event_name != 'push'
      run: |
        echo "::error::Translation templates are out of date. Run 'meson setup build && ninja -C build io.github.peteruithoven.resizer-pot extra-pot' locally and commit the result."
        exit 1
    - name: Translation status
      if: always()
      run: |
        {
          echo "### Translation status"
          echo
          echo "| Language | po/ | po/extra/ |"
          echo "|---|---|---|"
          for lang in $(sort -u po/LINGUAS po/extra/LINGUAS); do
            main="—"
            extra="—"
            [ -f "po/$lang.po" ] && main=$(msgfmt --statistics "po/$lang.po" -o /dev/null 2>&1)
            [ -f "po/extra/$lang.po" ] && extra=$(msgfmt --statistics "po/extra/$lang.po" -o /dev/null 2>&1)
            echo "| $lang | $main | $extra |"
          done
        } >> "$GITHUB_STEP_SUMMARY"

  data-lint:
    name: Data Files
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install validators
      run: sudo apt-get update && sudo apt-get install -y desktop-file-utils libxml2-utils appstream
    - name: Check .desktop syntax
      run: |
        tmp_desktop=$(mktemp --suffix=.desktop)
        cp data/io.github.peteruithoven.resizer.desktop.in "$tmp_desktop"
        desktop-file-validate "$tmp_desktop"
    - name: Check XML well-formedness
      run: xmllint --noout data/*.xml.in data/*.xml data/icons/*.svg
    - name: Validate AppStream metadata
      # --no-net: the screenshot URLs point at main, so a PR that adds or
      # renames a screenshot would otherwise fail until it's merged.
      run: appstreamcli validate --no-net data/io.github.peteruithoven.resizer.metainfo.xml.in

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y meson ninja-build valac libgtk-4-dev \
          libadwaita-1-dev gettext desktop-file-utils xvfb xdotool imagemagick
    - name: Build and install
      run: |
        meson setup build --prefix=/usr
        ninja -C build
        sudo ninja -C build install
    - name: Run smoke test
      run: xvfb-run -a ./scripts/smoke-test.sh

  flatpak:
    runs-on: ubuntu-latest
    # Flathub's builder image, with the GNOME runtime and SDK preinstalled.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
    - uses: actions/checkout@v5
    - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
      with:
        bundle: io.github.peteruithoven.resizer.flatpak
        manifest-path: io.github.peteruithoven.resizer.yml
        # Runs `meson test` in the sandbox, together with the manifest's
        # `run-tests: true` (see CLAUDE.md).
        run-tests: true
        cache-key: "flatpak-builder-${{ github.sha }}"
