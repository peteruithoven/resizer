name: CI

# Runs on pushes to main and on PR lifecycle events, but not both for the same
# commit: a push to a branch with an open PR would otherwise fire `push` *and*
# `pull_request:synchronize` for the identical SHA, running every job twice.
# (test commit: confirming synchronize alone still fires CI)
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  vala-lint:
    name: Vala Lint
    runs-on: ubuntu-latest
    container: valalang/lint:latest
    steps:
    - uses: actions/checkout@v5
    - name: Lint
      run: io.elementary.vala-lint -d src

  meson-format:
    name: Meson Format
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install meson
      run: pip install --user --break-system-packages "meson>=1.5"
    - name: Check formatting
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        meson format --check-only -r .

  po-lint:
    name: PO Files
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install gettext
      run: sudo apt-get update && sudo apt-get install -y gettext
    - name: Check .po files
      run: |
        for po in po/*.po; do
          msgfmt --check --check-format --check-domain -o /dev/null "$po"
        done

  data-lint:
    name: Data Files
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install validators
      run: sudo apt-get update && sudo apt-get install -y desktop-file-utils libxml2-utils appstream
    - name: Check .desktop syntax
      run: |
        tmp_desktop=$(mktemp --suffix=.desktop)
        cp data/com.github.peteruithoven.resizer.desktop.in "$tmp_desktop"
        desktop-file-validate "$tmp_desktop"
    - name: Check XML well-formedness
      run: xmllint --noout data/*.xml.in data/*.xml data/icons/*.svg
    - name: Validate AppStream metadata
      run: |
        out=$(appstreamcli validate data/com.github.peteruithoven.resizer.appdata.xml.in 2>&1)
        status=$?
        echo "$out"
        if [ $status -ne 0 ]; then
          # Ubuntu's appstreamcli 1.0.2 predates AppStream's addition of the
          # "pantheon:dark" environment id (added to desktop-style-ids.txt in
          # Sept 2024) and refuses to let screenshot-invalid-env-style be
          # downgraded below "warning" - so it fails on a tag that's valid
          # per the current AppStream spec. Tolerate only that known tag.
          unexpected=$(echo "$out" | grep -E '^[EW]: ' | grep -v 'screenshot-invalid-env-style' || true)
          if [ -n "$unexpected" ]; then
            exit $status
          fi
          echo "(ignoring screenshot-invalid-env-style: known appstreamcli 1.0.2 false positive for pantheon:dark)"
        fi

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y meson ninja-build valac libgtk-4-dev libgranite-7-dev \
          libadwaita-1-dev gettext desktop-file-utils xvfb xdotool imagemagick
    - name: Build and install
      run: |
        meson setup build --prefix=/usr
        ninja -C build
        sudo ninja -C build install
    - name: Run smoke test
      run: xvfb-run -a ./scripts/smoke-test.sh

  # This workflow contains a single job called "flatpak"
  flatpak:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # This job runs in a special container designed for building Flatpaks for AppCenter
    container:
      image: ghcr.io/elementary/flatpak-platform/runtime:8
      options: --privileged

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so the job can access it
    - uses: actions/checkout@v5

      # Builds your flatpak manifest using the Flatpak Builder action
    - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
      with:
        # This is the name of the Bundle file we're building and can be anything you like
        bundle: MyApp.flatpak
        # This uses your app's RDNN ID
        manifest-path: com.github.peteruithoven.resizer.yml

        # You can automatically run any of the tests you've created as part of this workflow
        run-tests: true

        # These lines specify the location of the elementary Runtime and Sdk
        repository-name: appcenter
        repository-url: https://flatpak.elementary.io/repo.flatpakrepo
        cache-key: "flatpak-builder-${{ github.sha }}"
