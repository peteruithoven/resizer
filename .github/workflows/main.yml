name: CI

# This workflow will run for any pull request or pushed commit
on: [push, pull_request]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  vala-lint:
    name: Vala Lint
    runs-on: ubuntu-latest
    container: valalang/lint:latest
    steps:
    - uses: actions/checkout@v5
    - name: Lint
      run: io.elementary.vala-lint -d src

  meson-format:
    name: Meson Format
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install meson
      run: pip install --user --break-system-packages "meson>=1.5"
    - name: Check formatting
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        meson format --check-only -r .

  po-lint:
    name: PO Files
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install gettext
      run: sudo apt-get update && sudo apt-get install -y gettext
    - name: Check .po files
      run: |
        for po in po/*.po; do
          msgfmt --check --check-format --check-domain -o /dev/null "$po"
        done

  data-lint:
    name: Data Files
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install validators
      run: sudo apt-get update && sudo apt-get install -y desktop-file-utils libxml2-utils appstream
    - name: Check .desktop syntax
      run: |
        tmp_desktop=$(mktemp --suffix=.desktop)
        cp data/com.github.peteruithoven.resizer.desktop.in "$tmp_desktop"
        desktop-file-validate "$tmp_desktop"
    - name: Check XML well-formedness
      run: xmllint --noout data/*.xml.in data/*.xml data/icons/*.svg
    - name: Validate AppStream metadata
      run: appstreamcli validate data/com.github.peteruithoven.resizer.appdata.xml.in

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y meson ninja-build valac libgtk-4-dev libgranite-7-dev \
          libadwaita-1-dev gettext desktop-file-utils xvfb xdotool imagemagick
    - name: Build and install
      run: |
        meson setup build --prefix=/usr
        ninja -C build
        sudo ninja -C build install
    - name: Run smoke test
      run: xvfb-run -a ./scripts/smoke-test.sh

  smoke-test-wayland:
    name: Smoke Test (Wayland, experimental)
    runs-on: ubuntu-latest
    # Spike: validates scripts/smoke-test-wayland.py (headless gala + a real
    # D-Bus session + org.gnome.Shell.Screenshot, instead of Xvfb + xdotool +
    # ImageMagick's `import`) against the real CI container, to check
    # whether it hits the slow xdg-desktop-portal backend activation that
    # smoke-test.sh's blackholed D-Bus buses exist to avoid (see that
    # script's docstring). continue-on-error since it's unproven - it must
    # not block merges yet.
    continue-on-error: true
    steps:
    - uses: actions/checkout@v5
    - name: Install dependencies
      run: |
        sudo add-apt-repository -y ppa:elementary-os/stable
        sudo apt-get update
        sudo apt-get install -y meson ninja-build valac libgtk-4-dev libgranite-7-dev \
          libadwaita-1-dev gettext desktop-file-utils imagemagick \
          gala accountsservice at-spi2-core python3-gi gir1.2-atspi-2.0 gdb
    - name: Build and install
      run: |
        meson setup build --prefix=/usr
        ninja -C build
        sudo ninja -C build install
    - name: Run smoke test (Wayland)
      run: |
        rt=$(mktemp -d /tmp/rsz-rt-XXXXXX)
        XDG_RUNTIME_DIR="$rt" dbus-run-session -- python3 scripts/smoke-test-wayland.py

  # This workflow contains a single job called "flatpak"
  flatpak:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # This job runs in a special container designed for building Flatpaks for AppCenter
    container:
      image: ghcr.io/elementary/flatpak-platform/runtime:8
      options: --privileged

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so the job can access it
    - uses: actions/checkout@v5

      # Builds your flatpak manifest using the Flatpak Builder action
    - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
      with:
        # This is the name of the Bundle file we're building and can be anything you like
        bundle: MyApp.flatpak
        # This uses your app's RDNN ID
        manifest-path: com.github.peteruithoven.resizer.yml

        # You can automatically run any of the tests you've created as part of this workflow
        run-tests: true

        # These lines specify the location of the elementary Runtime and Sdk
        repository-name: appcenter
        repository-url: https://flatpak.elementary.io/repo.flatpakrepo
        cache-key: "flatpak-builder-${{ github.sha }}"
