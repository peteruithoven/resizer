app-id: io.github.peteruithoven.resizer
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: io.github.peteruithoven.resizer

finish-args:
  - '--share=ipc'
  - '--socket=fallback-x11'
  - '--socket=wayland'
  # Resized images are written next to the originals.
  - '--filesystem=home'

modules:
  - name: resizer
    buildsystem: meson
    run-tests: true
    sources:
      - type: dir
        path: .
